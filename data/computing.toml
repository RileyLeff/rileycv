# data/computing.toml
# Software, grouped by what it is for. Each example names its language.
# `[Link]` in `text` marks where the link goes.

languages = "Rust, Python, R, TypeScript"

[[group]]
name = "Measurement & Field Infrastructure"
examples = [
  { text = "heatpulse-decompression: finite-pulse heat transport model for heat-pulse sap flux, with Bayesian inference on matched Metal and CUDA GPU kernels (Python). Code available on request." },
  { text = "sdi12: no_std implementation of the SDI-12 protocol for embedded environmental sensors. The core runs anywhere with a GPIO, with adapters for RP2040, STM32, and ESP32 (Rust). [Link]", link = "https://github.com/RileyLeff/sdi12" },
  { text = "licor: type-safe parser for LI-COR 6800 data with Python and R bindings (Rust). [Link]", link = "https://github.com/RileyLeff/licor" },
  { text = "rileaf2: PWA for measuring leaf area from images, designed for field use with the LI-COR 6800 (TypeScript). [Link]", link = "https://github.com/RileyLeff/rileaf2" },
  { text = "annopurr: WebGPU image annotation tool for scientific measurements with TIFF support (TypeScript). [Link]", link = "https://github.com/RileyLeff/annopurr" },
]

[[group]]
name = "Scientific Models & Data"
examples = [
  { text = "myco: a declarative, acausal programming language for scientific models (Rust). [Link]", link = "https://github.com/RileyLeff/myco" },
  { text = "ozzydb: a purely functional approach to version control for scientific data (Rust). [Link]", link = "https://github.com/RileyLeff/ozzydb" },
  { text = "ezSperry: interface to Sperry's stomatal optimization model (R). [Link]", link = "https://github.com/RileyLeff/ezSperry-beta" },
]

[[group]]
name = "AI & Research Computing"
examples = [
  { text = "quadrat: causal ecosystem simulator for benchmarking ecological reasoning in LLM agents, with Docker-sandboxed agent evaluation (Python). Code available on request." },
  { text = "gwu-hpc-mcp: lets AI agents use GWU's Pegasus cluster through the researcher's own authenticated connection, with 2FA kept in the researcher's hands (Rust). [Link]", link = "https://github.com/RileyLeff/gwu-hpc-mcp" },
]

[[group]]
name = "Web"
examples = [
  { text = "riley web services: self-hosted suite powering rileyleff.com: accounts and sign-in, Git-backed content management, leaderboards, and comments (Rust). [Link]", link = "https://rileyleff.com" },
]
