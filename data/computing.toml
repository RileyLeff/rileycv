examples = [
  { text = "rileyviewer: Browser-based plot viewer for matplotlib/seaborn, inspired by R's httpgd. [Link]", short_text = "rileyviewer: browser-based plot viewer", link = "https://github.com/RileyLeff/rileyviewer"},
  { text = "Retrieval-Augmented Generation (RAG) utility script for linking your local Zotero library to LLMs. [Link]", short_text = "RAG utility for Zotero + LLMs", link = "https://github.com/RileyLeff/tryllm/blob/main/use_assistant.py"},
  { text = "Zotero Expander Script: Add all citations from a paper to your library. [Link]", short_text = "Zotero citation expander", link = "https://github.com/RileyLeff/tryllm/blob/main/expand_citations.py"},
]

