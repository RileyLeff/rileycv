# data/computing.toml

# No top-level introduction needed if we structure it well below.

[[primary_languages]]
name = "Rust"
short_description = "Static typing, memory safety, performance-critical applications."
examples = [
  { text = "myco: a declarative, acausal programming language for scientific models — e-graph compiler, NumPy/JAX backends, Python bindings. [Link]", short_text = "myco: language for scientific models", link = "https://github.com/RileyLeff/myco"},
  { text = "ozzydb: version control for scientific data, built on immutable, content-addressed artifacts and versioned transforms; Rust server, CLI, web frontend, and Python client. [Link]", short_text = "ozzydb: version control for scientific data", link = "https://github.com/RileyLeff/ozzydb"},
  { text = "sdi12: no_std implementation of the SDI-12 protocol for embedded environmental sensors — the core runs anywhere with a GPIO, with firmware adapters for RP2040, STM32, and ESP32. [Link]", short_text = "sdi12: embedded sensor protocol", link = "https://github.com/RileyLeff/sdi12"},
  { text = "riley_auth: OAuth2/OIDC identity provider with PKCE, refresh-token rotation and reuse detection, and JWKS key rotation. [Link]", short_text = "riley_auth: OAuth2/OIDC provider", link = "https://github.com/RileyLeff/riley_auth"},
  { text = "Floco: a library to enforce user-defined constraints on arbitrarily-sized floats directly within Rust's type system; an early inspiration for myco. [Link]", short_text = "Floco: constrained float types", link = "https://crates.io/crates/floco"},
  { text = "Dirgrab: CLI utility for injecting entire local projects into LLM context windows. [Link]", short_text = "Dirgrab: codebase-to-LLM tool", link = "https://crates.io/crates/dirgrab"},
  { text = "licor: Type-safe parser for LI-COR 6800 data with Python and R bindings. [Link]", short_text = "licor: LI-COR 6800 data parser", link = "https://github.com/RileyLeff/licor"},
]

[[primary_languages]]
name = "Python"
short_description = "Prototyping, data analysis, AI/ML."
examples = [
  { text = "quadrat: causal ecosystem simulator for benchmarking ecological reasoning in LLM agents, with Docker-sandboxed agent evaluation. Code available on request.", short_text = "quadrat: LLM ecology reasoning benchmark"},
  { text = "rileyviewer: Browser-based plot viewer for matplotlib/seaborn, inspired by R's httpgd. [Link]", short_text = "rileyviewer: browser-based plot viewer", link = "https://github.com/RileyLeff/rileyviewer"},
]

[[other_languages]]
name = "R"
examples = [
  { text = "ezSperry: Wrapper package to call a stomatal optimization model from R. [Link]", link = "https://github.com/RileyLeff/ezSperry-beta"},
]

[[other_languages]]
name = "JavaScript / TypeScript"
examples = [
  { text = "Forest Royale: an educational 3D multiplayer game to communicate plant physiology concepts to students. [Link]", link = "https://forestroyale.rileyleff.com" },
  { text = "annopurr: WebGPU image annotation tool for scientific measurements with TIFF support. [Link]", link = "https://github.com/RileyLeff/annopurr" },
  { text = "rileaf2: PWA for measuring leaf area from images, designed for field use with the LI-COR 6800. [Link]", link = "https://github.com/RileyLeff/rileaf2" },
  { text = "RiLeaf.ijm: ImageJ macro automating leaf area quantification. [Link]", link = "https://gist.github.com/RileyLeff/0bd4062dcbe4a6e5aa39489a7edd9edc" }
]

[[other_languages]]
name = "Typst"
examples = [
