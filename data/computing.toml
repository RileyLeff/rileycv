# data/computing.toml

# No top-level introduction needed if we structure it well below.

[[primary_languages]]
name = "Rust"
description = "My preference for any projects that benefit from static typing, robust error handling, and memory safety."
short_description = "Static typing, memory safety, performance-critical applications."
examples = [
  { text = "Floco: a library to enforce user-defined constraints on arbitrarily-sized floats directly within Rust's type system. [Link]", short_text = "Floco: constrained float types", link = "https://crates.io/crates/floco"},
  { text = "Dirgrab: CLI utility for injecting entire local projects into LLM context windows. [Link]", short_text = "Dirgrab: codebase-to-LLM tool", link = "https://crates.io/crates/dirgrab"},
  { text = "riley_cms: Minimal self-hosted headless CMS using Git as the content database. [Link]", short_text = "riley_cms: Git-based headless CMS", link = "https://github.com/RileyLeff/riley_cms"},
  { text = "licor: Type-safe parser for LI-COR 6800 data with Python and R bindings. [Link]", short_text = "licor: LI-COR 6800 data parser", link = "https://github.com/RileyLeff/licor"},
  { text = "SDI-12: Implementation of a legacy serial standard for communication with embedded environmental sensors. [Link]", short_text = "SDI-12: sensor communication protocol", link = "https://github.com/RileyLeff/sdi12"},
  { text = "High-performance backends for scientific models.", short_text = "Scientific model backends" }
]

[[primary_languages]]
